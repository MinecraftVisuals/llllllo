<style>
  :root {
    --bg: #ffffff;
    --speak: #3ddc84;
    --text: #333333;
    --size: clamp(120px, 24vmin, 210px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }

  .stage {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 36px 48px;
    padding: 24px;
  }

  .person { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .person .name { font-size: 15px; }

  .ring { width: var(--size); height: var(--size); border-radius: 50%; transition: box-shadow .15s; }
  .ring svg { display: block; width: 100%; height: 100%; }

  .person.speaking .ring {
    box-shadow: 0 0 0 5px var(--speak), 0 0 28px rgba(61, 220, 132, .55);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { box-shadow: 0 0 0 9px rgba(61, 220, 132, .55), 0 0 40px rgba(61, 220, 132, .35); }
  }
  @media (prefers-reduced-motion: reduce) { .person.speaking .ring { animation: none; } }

  .controls {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 18px 18px 44px; font-size: 14px;
  }
  .notice { color: #777; min-height: 1em; text-align: center; }
  .controls button { font: inherit; cursor: pointer; }
  #callBtn {
    color: var(--text); background: #f2f2f2;
    border: 1px solid #d6d6d6; border-radius: 999px; padding: 9px 18px;
  }
  #callBtn:hover { background: #e6e6e6; }

  /* Greyish curved box with the mic icon */
  #callBtns { display: none; align-items: center; justify-content: center; gap: 12px; }
  #muteBtn, #deafBtn {
    display: flex; align-items: center; justify-content: center;
    width: 76px; height: 50px; border: 0; border-radius: 26px;
    background: #e6e7ea; transition: background .15s, transform .1s;
  }
  #muteBtn:hover, #deafBtn:hover { background: #d9dadf; }
  #muteBtn:active, #deafBtn:active { transform: scale(.95); }
  #muteBtn img, #deafBtn img { width: 28px; height: 28px; display: block; pointer-events: none; }
  #volPanel.deaf { opacity: .4; }

  /* Same curved box as the mute button, but red with a white phone icon */
  #endBtn {
    display: flex; align-items: center; justify-content: center;
    width: 76px; height: 50px; border: 0; border-radius: 26px;
    background: #dc0000; transition: background .15s, transform .1s;
  }
  #endBtn:hover { background: #c40000; }
  #endBtn:active { transform: scale(.95); }
  #endBtn svg { width: 40px; height: auto; display: block; pointer-events: none; }
  button:focus-visible { outline: 2px solid var(--speak); outline-offset: 2px; }

  /* Discord-style "User Volume" slider, sits above the mute button */
  #volPanel {
    display: none; width: 156px; padding: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #volPanel.show { display: block; }
  .vol-row { --p: .5; padding: 10px 0; }
  .vol-label {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .vol-wrap { position: relative; height: 16px; }
  .vol-slider {
    -webkit-appearance: none; appearance: none; display: block;
    width: 100%; height: 16px; margin: 0; padding: 0;
    background: transparent; cursor: pointer; outline: none;
  }
  .vol-slider::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right,

    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -4px;

  .vol-slider::-moz-range-thumb {
    width: 14px; height: 14px; border: 0; border-radius: 50%;

  /* little black percent bubble that shows while you drag (like Discord) */
  .vol-tip {
    position: absolute; bottom: calc(100% + 6px);
    left: calc(7px + (100% - 14px) * var(--p));
    transform: translateX(-50%);
    padding: 4px 8px; border-radius: 4px; background: #000; color: #fff;
    font-size: 12px; font-weight: 600; line-height: 16px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .1s; z-index: 2;
  }
  .vol-tip::after {
    content: ""; position: absolute; top: 100%; left: 50%; margin-left: -4px;
    border: 4px solid transparent; border-top-color: #000;
  }
  .vol-row.dragging .vol-tip { opacity: 1; }

  deafIcon.src = HP_ON;
  const sfx = new Audio(SFX);

  const AVATAR = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><clipPath id="c"><circle cx="50" cy="50" r="50"/></clipPath></defs>
      <circle cx="50" cy="50" r="50" fill="#c4c4c4"/>

  let friendCount = 0;
  function addParticipant(id, name) {
    if (people.has(id)) return;
    const el = document.createElement('div');
    el.className = 'person';
    el.innerHTML = `<div class="ring">${AVATAR}</div><div class="name"></div>`;
    el.querySelector('.name').textContent = name;
    stage.appendChild(el);
    people.set(id, el);
    refreshVolumePanel();
  }
  function removeParticipant(id) {
    const el = people.get(id);
    if (el) { el.remove(); people.delete(id); }
    refreshVolumePanel();
  }

  /* ---------- volume: one slider for everyone else (client side only, 0-200%) ---------- */
  const volPanel = document.getElementById('volPanel');
  const volRow = volPanel.querySelector('.vol-row');
  const volSlider = document.getElementById('volSlider');
  const volTip = document.getElementById('volTip');
  const VOL_MAX = 200;
  let masterVol = 100;   // percent, applies to every other person in the call
  let deafened = false;  // true = you can't hear anyone

  function paintVolume() {
    const v = +volSlider.value;
    volRow.style.setProperty('--p', v / VOL_MAX);
    volTip.textContent = v + '%';
    volSlider.setAttribute('aria-valuetext', v + '%');
  }
  function refreshVolumePanel() {
    volPanel.classList.toggle('show', [...people.keys()].some(k => k !== 'me'));
  }
  function applyVolume(id) {
    const p = peers.get(id);
    if (!p || !p.gain || !audioCtx) return;
    p.gain.gain.setTargetAtTime(deafened ? 0 : masterVol / 100, audioCtx.currentTime, 0.015);
  }
  function applyDeafen() {
    deafIcon.src = deafened ? HP_OFF : HP_ON;
    deafBtn.setAttribute('aria-pressed', String(deafened));
    deafBtn.setAttribute('aria-label', deafened ? 'Undeafen' : 'Deafen');
    volPanel.classList.toggle('deaf', deafened);
    peers.forEach((p, id) => applyVolume(id));
  }
  function resetVolume() {
    masterVol = 100;
    volSlider.value = 100;
    paintVolume();
  }

  (function wireVolumeSlider() {
    let down = false, hideTimer = 0;
    const show = () => volRow.classList.add('dragging');
    const hide = () => volRow.classList.remove('dragging');
    volSlider.addEventListener('input', () => {
      masterVol = +volSlider.value;
      paintVolume();
      peers.forEach((p, id) => applyVolume(id));
      show();
      if (!down) { clearTimeout(hideTimer); hideTimer = setTimeout(hide, 900); }
    });
    volSlider.addEventListener('pointerdown', () => {
      down = true; show();
      const up = () => { down = false; hide(); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    });
    paintVolume();
  })();

  function setSpeaking(id, on) {
    const el = people.get(id);
    if (el) el.classList.toggle('speaking', on);
  }

  /* ============================================================
     Call state
     ============================================================ */
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const myId = Math.random().toString(36).slice(2);

  let channel = null;
  let localStream = null;
  let audioCtx = null;
  let muted = false;
  let aloneSince = 0;
  let aloneTimer = null;
  const peers = new Map();    // id -> { pc, audio, pending, metered }
  const meters = new Map();   // id -> interval

  function send(payload) {
    if (channel) channel.send({ type: 'broadcast', event: 'signal', payload: { ...payload, from: myId } });
  }

  function openChannel() {
    return new Promise((resolve, reject) => {
      channel = supabaseClient.channel(ROOM, { config: { broadcast: { self: false } } });
      channel
        .on('broadcast', { event: 'signal' }, ({ payload }) => onSignal(payload))
        .subscribe((s) => {
          if (s === 'SUBSCRIBED') resolve();
          else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') reject(new Error(s));
        });
      setTimeout(() => reject(new Error('timeout')), 10000);
    });
  }

  /* ---------- peers (one connection per other person) ---------- */
  function getPeer(id) {
    let p = peers.get(id);
    if (p) return p;
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    p = { pc, audio: null, src: null, gain: null, pending: [], metered: false };
    peers.set(id, p);
    aloneSince = 0;

    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    pc.onicecandidate = (e) => { if (e.candidate) send({ candidate: e.candidate, to: id }); };

    pc.ontrack = (e) => {
      const stream = e.streams[0] || new MediaStream([e.track]);
      if (!p.audio) {
        p.audio = document.createElement('audio');
        p.audio.autoplay = true;
        p.audio.playsInline = true;
        document.body.appendChild(p.audio);
      }
      p.audio.srcObject = stream;
      // Chrome only feeds Web Audio from a remote stream while it is attached to a media element,
      // so the element keeps playing silently and the real sound goes through a gain node.
      // That gain node is what the volume slider controls (and lets it go past 100%).
      p.audio.muted = true;
      p.audio.play().catch(() => {});
      if (p.src) { try { p.src.disconnect(); } catch (_) {} }
      p.src = audioCtx.createMediaStreamSource(stream);
      if (!p.gain) {
        p.gain = audioCtx.createGain();
        p.gain.gain.value = deafened ? 0 : masterVol / 100;
        p.gain.connect(audioCtx.destination);
      }
      p.src.connect(p.gain);
      if (audioCtx.state === 'suspended') notice.textContent = 'Tap anywhere to turn on sound.';
      if (!people.has(id)) {
        friendCount++;
        addParticipant(id, friendCount === 1 ? 'Friend' : 'Friend ' + friendCount);
      }
      if (!p.metered) { p.metered = true; setupVoiceMeter(stream, id); }
    };

    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === 'failed' || s === 'closed') removePeer(id);
      else if (s === 'disconnected') {
        setTimeout(() => {
          if (peers.get(id) === p && pc.connectionState === 'disconnected') removePeer(id);
        }, 8000);
      }
    };
    return p;
  }

  function removePeer(id) {
    const p = peers.get(id);
    if (!p) return;
    peers.delete(id);
    try { p.pc.close(); } catch (e) {}
    try { if (p.src) p.src.disconnect(); if (p.gain) p.gain.disconnect(); } catch (_) {}
    if (p.audio) { p.audio.srcObject = null; p.audio.remove(); }
    clearInterval(meters.get(id)); meters.delete(id);
    removeParticipant(id);
    if (peers.size === 0) aloneSince = Date.now();
  }

  async function flushPending(p) {
    for (const c of p.pending) await p.pc.addIceCandidate(c).catch(() => {});
    p.pending = [];
  }

  async function onSignal(payload) {
    if (!localStream || payload.from === myId) return;
    if (payload.to && payload.to !== myId) return;
    const from = payload.from;
    try {
      if (payload.join) {
        // Someone new arrived: I'm already here, so I start the connection to them.
        if (peers.has(from)) removePeer(from);
        const p = getPeer(from);
        const offer = await p.pc.createOffer();
        await p.pc.setLocalDescription(offer);
        send({ offer, to: from });
      } else if (payload.leave) {
        removePeer(from);
      } else if (payload.offer) {
        const p = getPeer(from);
        // Both offered at once: lower id ignores the other's offer, higher id yields.
        if (p.pc.signalingState !== 'stable' && myId < from) return;
        await p.pc.setRemoteDescription(new RTCSessionDescription(payload.offer));
        await flushPending(p);
        const answer = await p.pc.createAnswer();
        await p.pc.setLocalDescription(answer);
        send({ answer, to: from });
      } else if (payload.answer) {
        const p = peers.get(from);
        if (!p || p.pc.signalingState !== 'have-local-offer') return;
        await p.pc.setRemoteDescription(new RTCSessionDescription(payload.answer));
        await flushPending(p);
      } else if (payload.candidate) {
        const p = peers.get(from) || getPeer(from);
        const c = new RTCIceCandidate(payload.candidate);
        if (p.pc.remoteDescription) await p.pc.addIceCandidate(c).catch(() => {});
        else p.pending.push(c);
      }
    } catch (err) { console.error('signal error', err); }
  }

  /* ---------- speaking indicator (measured locally from each audio stream) ---------- */
  function setupVoiceMeter(stream, targetId) {
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    let last = false;
    meters.set(targetId, setInterval(() => {
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const on = (sum / data.length) > 12;
      if (on !== last) { last = on; setSpeaking(targetId, on); }
    }, 150));
  }

  /* ---------- mute ---------- */
  function applyMute() {
    if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !muted);
    muteIcon.src = muted ? MIC_OFF : MIC_ON;
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'Unmute microphone' : 'Mute microphone');
    if (muted) setSpeaking('me', false);
  }
  muteBtn.onclick = () => {
    muted = !muted;
    applyMute();
    sfx.currentTime = 0;
    sfx.play().catch(() => {});
  };

  /* ---------- make sure incoming sound actually plays (phones block autoplay) ---------- */
  function resumeAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => {
        if (notice.textContent.startsWith('Tap anywhere')) notice.textContent = '';
      }).catch(() => {});
    }
    peers.forEach(p => {
      if (p.audio && p.audio.paused) {
        p.audio.play().then(() => {
          if (notice.textContent.startsWith('Tap anywhere')) notice.textContent = '';
        }).catch(() => {});
      }
    });
  }
  document.addEventListener('pointerdown', resumeAudio);

  /* ---------- join / leave ---------- */
  async function joinCall() {
    notice.textContent = '';
    callBtn.disabled = true;
    callBtn.textContent = 'Connecting...';
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
      await openChannel();
    } catch (err) {
      await leaveCall();
      notice.textContent = 'Could not join. Check microphone permission and your connection.';
      return;
    }
    friendCount = 0;
    muted = START_MUTED;
    applyMute();
    addParticipant('me', 'You');
    setupVoiceMeter(localStream, 'me');
    callBtn.style.display = 'none';
    callBtns.style.display = 'flex';
    aloneSince = Date.now();
    aloneTimer = setInterval(() => {
      resumeAudio();
      if (peers.size === 0 && Date.now() - aloneSince > ALONE_LIMIT_MS) {
        leaveCall().then(() => { notice.textContent = 'You were alone for 3 minutes, so the call ended.'; });
      }
    }, 5000);
    send({ join: true });
  }

  async function leaveCall() {
    clearInterval(aloneTimer); aloneTimer = null;
    send({ leave: true });
    [...peers.keys()].forEach(removePeer);
    meters.forEach(clearInterval); meters.clear();
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    if (channel) { await supabaseClient.removeChannel(channel).catch(() => {}); channel = null; }
    [...people.keys()].forEach(removeParticipant);
    resetVolume();
    deafened = false; applyDeafen();
    callBtns.style.display = 'none';
    callBtn.style.display = '';
    callBtn.disabled = false;
    callBtn.textContent = 'Join Voice Chat';
  }

  callBtn.onclick = () => { if (!localStream) joinCall(); };
  deafBtn.onclick = () => {
    deafened = !deafened;
    applyDeafen();
    sfx.currentTime = 0;
    sfx.play().catch(() => {});
  };
  endBtn.onclick = () => {
    if (!localStream) return;
    sfx.currentTime = 0;
    sfx.play().catch(() => {});
    leaveCall();
  };
  window.addEventListener('pagehide', () => { if (channel) send({ leave: true }); });
</script>
</body>
</html>
